name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Manifest and syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate package, patch, and client wiring
        run: node scripts/check.mjs

      - name: Check the pricing helpers
        run: node scripts/cost.test.mjs

      - name: Parse the host half
        run: node --check index.js

      - name: Parse the client half
        run: node --check client.js
